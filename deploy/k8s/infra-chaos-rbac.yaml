apiVersion: v1
kind: ServiceAccount
metadata: {name: infra-chaos, namespace: incident-lab}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: infra-chaos, namespace: incident-lab}
rules:
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    resourceNames: [order-service, inventory-service, payment-service, demo-fault-oom, demo-fault-node]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [order-service, inventory-service, payment-service, demo-fault-oom, demo-fault-node]
    verbs: [patch, update]
  - apiGroups: [apps]
    resources: [statefulsets, statefulsets/scale]
    resourceNames: [demo-fault-pod]
    verbs: [get]
  - apiGroups: [apps]
    resources: [statefulsets/scale]
    resourceNames: [demo-fault-pod]
    verbs: [patch, update]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods]
    resourceNames: [demo-fault-pod-0]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: infra-chaos, namespace: incident-lab}
subjects:
  - {kind: ServiceAccount, name: infra-chaos, namespace: incident-lab}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: infra-chaos}