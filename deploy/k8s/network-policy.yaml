# Inbound lockdown only: nothing outside the cluster may reach these pods. Outbound (LLM APIs, GitHub) stays open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: deny-external-ingress, namespace: incident-lab}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: incident-lab}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}