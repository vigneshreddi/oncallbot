apiVersion: apps/v1
kind: Deployment
metadata: {name: order-service, namespace: incident-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: order-service}}
  template:
    metadata:
      labels: {app: order-service, incidentlab/access-postgres: "true"}
      annotations: {git-commit: local-demo}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      nodeSelector: {incidentlab/node-group: control}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      volumes:
        - {name: tmp, emptyDir: {}}
      containers:
        - name: app
          image: docker.io/library/incident-lab-order-service:local
          imagePullPolicy: Always
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          env:
            - {name: SERVICE_NAME, value: order-service}
            - {name: GIT_COMMIT, value: local-demo}
            - {name: DB_SCHEMA, value: orders}
            - {name: DB_USER, value: order_svc}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-secret, key: ORDER_PASSWORD}}}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /actuator/health, port: 8080}, initialDelaySeconds: 20, periodSeconds: 5}
          resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {memory: 768Mi}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
---
apiVersion: v1
kind: Service
metadata: {name: order-service, namespace: incident-lab}
spec:
  type: ClusterIP
  selector: {app: order-service}
  ports: [{port: 8080, targetPort: 8080}]
---
