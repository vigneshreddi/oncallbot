apiVersion: v1
kind: ServiceAccount
metadata: {name: investigator, namespace: incident-lab}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: investigator, namespace: incident-lab}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: investigator, namespace: incident-lab}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: investigator}
subjects: [{kind: ServiceAccount, name: investigator, namespace: incident-lab}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: investigator, namespace: incident-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: investigator}}
  template:
    metadata: {labels: {app: investigator, incidentlab/access-postgres: "true"}}
    spec:
      serviceAccountName: investigator
      automountServiceAccountToken: true
      nodeSelector: {incidentlab/node-group: worker}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: services-config, configMap: {name: services-config}}
      containers:
        - name: investigator
          image: docker.io/library/incident-lab-investigator:local
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          envFrom:
            - secretRef: {name: app-secrets, optional: true}
          env:
            - {name: TARGET_NAMESPACE, value: incident-lab}
            - {name: DATABASE_URL, value: postgresql://investigator_app@postgres:5432/incidents}
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: postgres-secret, key: INVESTIGATOR_PASSWORD}}}
            - {name: READONLY_DATABASE_URL, value: "postgresql://investigator_ro@postgres:5432/incidents?options=-c%20default_transaction_read_only%3Don%20-c%20statement_timeout%3D3000"}
            - {name: RO_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-secret, key: RO_PASSWORD}}}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 10}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: services-config, mountPath: /app/config, readOnly: true}
---
apiVersion: v1
kind: Service
metadata: {name: investigator, namespace: incident-lab}
spec:
  type: ClusterIP
  selector: {app: investigator}
  ports: [{port: 8080, targetPort: 8080}]
