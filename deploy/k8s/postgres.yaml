apiVersion: v1
kind: Namespace
metadata:
  name: incident-lab
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: incident-lab
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      volumes: [{name: run, emptyDir: {}}, {name: tmp, emptyDir: {}}]
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
          ports: [{containerPort: 5432}]
          env:
            - name: POSTGRES_DB
              value: incidents
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # Port-forwards arrive on 127.0.0.1; the image default would trust them without a password.
            - name: POSTGRES_INITDB_ARGS
              value: --auth-local=trust --auth-host=scram-sha-256
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U app -d incidents"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: incident-lab
spec:
  type: ClusterIP
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres-policy, namespace: incident-lab}
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {incidentlab/access-postgres: "true"}}}]
      ports: [{protocol: TCP, port: 5432}]
