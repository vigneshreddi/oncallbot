server:
  port: 8080
spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/incidents?currentSchema=payments
    username: ${DB_USER:payment_svc}
    password: ${DB_PASSWORD:}
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  structured:
    format:
      console: ecs
