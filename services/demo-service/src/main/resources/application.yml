server:
  port: 8080
spring:
  application:
    name: ${SERVICE_NAME:demo-service}
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/incidents?currentSchema=${DB_SCHEMA:public}
    username: ${DB_USER}
    password: ${DB_PASSWORD:}
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  structured:
    format:
      console: ecs
app:
  peers:
    inventory: ${INVENTORY_URL:http://inventory-service:8080}
    payment: ${PAYMENT_URL:http://payment-service:8080}
