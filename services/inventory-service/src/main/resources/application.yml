server:
  port: 8080
spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/incidents?currentSchema=inventory
    username: ${DB_USER:inventory_svc}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
inventory:
  demo-faults:
    enabled: ${INVENTORY_DEMO_FAULTS_ENABLED:false}
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  structured:
    format:
      console: ecs
